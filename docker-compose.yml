services:
  postgres:
    image: postgres:17-alpine
    container_name: cargos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargos
      POSTGRES_PASSWORD: cargos
      POSTGRES_DB: cargos_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cargos_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
