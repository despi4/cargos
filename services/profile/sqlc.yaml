version: "2"
sql:
  - engine: "postgresql"
    queries: "sql_queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          # Переопределение для UUID
          - db_type: uuid
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          
          # Переопределение для Timestamptz (с учетом часового пояса)
          - db_type: timestamptz
            go_type:
              import: "time"
              package: "time"
              type: "Time"
              
          # На всякий случай, если будешь использовать обычный Timestamp (без зоны)
          - db_type: timestamp
            go_type:
              import: "time"
              package: "time"
              type: "Time"