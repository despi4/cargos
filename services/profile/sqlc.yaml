version: "2"
sql:
  - engine: "postgresql"
    # Лучше указывать папку, а не конкретный файл. 
    # Тогда, если ты добавишь users.sql, sqlc подхватит и его тоже.
    queries: "sql_queries/" 
    
    # КРИТИЧНО: Указывай папку с миграциями, а не один файл!
    # sqlc должен прочитать все файлы .up.sql по порядку, чтобы понять итоговую структуру БД.
    schema: "migrations/" 
    
    gen:
      go:
        package: "repository"         # Имя пакета в сгенерированных Go-файлах (package repository)
        out: "internal/repository/"   # Папка, куда sqlc положит сгенерированный код
        sql_package: "pgx/v5"         # Указание использовать драйвер pgx
        
        # Крайне рекомендую добавить эти два флага:
        emit_interface: true          # Сгенерирует интерфейс Querier (полезно для архитектуры и моков)
        emit_json_tags: true          # Автоматически добавит теги `json:"..."` к структурам